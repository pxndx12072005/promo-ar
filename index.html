<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos - Promoción 2025</title>
    <style>
        /* --- ESTILOS GENERALES Y FONDO DE LÁMPARA --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            
            /* FONDO NEGRO */
            background-color: #000000; 
            
            /* EFECTO DE LÁMPARA / FOCO (Spotlight) */
            /* Crea una luz dorada suave desde arriba hacia el centro */
            background-image: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.3) 0%, rgba(0, 0, 0, 0) 65%);
            
            color: #ffffff; 
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* Contenedor del menú */
        .container {
            text-align: center;
            opacity: 0; 
            transition: opacity 1.5s ease-in;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            
            /* Un pequeño brillo detrás del texto para resaltar */
            text-shadow: 0px 0px 20px rgba(0,0,0,0.8);
        }

        h1 {
            font-weight: 300;
            letter-spacing: 4px; /* Letras separadas estilo cine */
            margin-bottom: 50px;
            font-size: 26px;
            text-transform: uppercase;
            color: #f0f0f0;
            line-height: 1.4;
        }

        /* --- BOTONES PREMIUM --- */
        .btn-minimal {
            display: block;
            width: 100%;
            padding: 18px 0;
            margin: 25px 0;
            background-color: rgba(0,0,0,0.3); /* Fondo semitransparente */
            
            /* Borde blanco fino */
            border: 1px solid rgba(255, 255, 255, 0.7); 
            color: #ffffff;
            
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 3px;
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }

        .btn-minimal:hover {
            /* Al pasar el mouse: se ilumina un poco dorado */
            background-color: rgba(212, 175, 55, 0.1);
            border-color: #d4af37; /* Color Oro */
            color: #fff;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            transform: translateY(-2px);
        }

        /* Iconos decorativos en los botones (opcional) */
        .icono { margin-right: 8px; }


        /* --- CAPA DE VIDEO INTRO (Se mantiene igual) --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out, visibility 1s ease-out;
        }

        #intro-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background-color: black;
            object-position: center; 
        }

        .ocultar {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <video id="intro-video" 
               src="https://res.cloudinary.com/dlq9ygm8f/video/upload/v1767060021/logodark_1_d2gxjm.mp4" 
               autoplay muted playsinline webkit-playsinline></video>
    </div>

    <div class="container" id="menu-principal">
        <h1>RECUERDO DE<br>PROMOCIÓN</h1>
        
        <a href="ar.html" class="btn-minimal">
            <span class="icono">✨</span> Experiencia AR
        </a>

        <a href="galeria.html" class="btn-minimal">
            <span class="icono">📸</span> Galería de Fotos
        </a>
    </div>

    <script>
        const video = document.getElementById('intro-video');
        const overlay = document.getElementById('intro-overlay');
        const menu = document.getElementById('menu-principal');

        function finalizarIntro() {
            overlay.classList.add('ocultar'); 
            menu.style.opacity = '1';         
            document.body.style.overflow = 'auto'; 
            
            setTimeout(() => {
                video.pause();
                overlay.style.display = 'none';
            }, 1000);
        }

        video.onended = function() {
            finalizarIntro();
        };

        // Seguridad por si el video falla
        setTimeout(() => {
            if (!video.ended && video.paused) {
                finalizarIntro();
            }
        }, 6000); 

        overlay.addEventListener('click', finalizarIntro);
    </script>

</body>
</html>
