<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos - Promoción 2025</title>
    <style>
        /* --- ESTILOS GENERALES Y MINIMALISTAS --- */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            
            /* CAMBIO: FONDO NEGRO Y LETRAS BLANCAS */
            background-color: #000000; 
            color: #ffffff; 
            
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* Contenedor del menú principal */
        .container {
            text-align: center;
            opacity: 0; 
            transition: opacity 1.5s ease-in;
            z-index: 10;
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 50px;
            font-size: 24px;
            text-transform: uppercase;
            color: #ffffff; /* Título blanco */
        }

        /* --- BOTONES MINIMALISTAS (INVERTIDOS) --- */
        .btn-minimal {
            display: block;
            width: 100%;
            padding: 15px 0;
            margin: 20px 0;
            background-color: transparent;
            
            /* CAMBIO: BORDE BLANCO Y TEXTO BLANCO */
            border: 1px solid #ffffff; 
            color: #ffffff;
            
            text-decoration: none;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-minimal:hover {
            /* CAMBIO: AL PASAR MOUSE, FONDO BLANCO Y LETRA NEGRA */
            background-color: #ffffff;
            color: #000000;
            transform: scale(1.02);
        }

        /* --- CAPA DE VIDEO INTRO --- */
        #intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out, visibility 1s ease-out;
        }

        #intro-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain; 
            background-color: black;
            object-position: center; 
        }

        .ocultar {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="intro-overlay">
        <video id="intro-video" 
               src="https://res.cloudinary.com/dlq9ygm8f/video/upload/v1767060021/logodark_1_d2gxjm.mp4" 
               autoplay muted playsinline webkit-playsinline></video>
    </div>

    <div class="container" id="menu-principal">
        <h1>Recuerdo de Promoción</h1>
        
        <a href="ar.html" class="btn-minimal">
            ✨ Experiencia AR
        </a>

        <a href="galeria.html" class="btn-minimal">
            📸 Galería de Fotos
        </a>
    </div>

    <script>
        const video = document.getElementById('intro-video');
        const overlay = document.getElementById('intro-overlay');
        const menu = document.getElementById('menu-principal');

        function finalizarIntro() {
            overlay.classList.add('ocultar'); 
            menu.style.opacity = '1';         
            document.body.style.overflow = 'auto'; 
            
            setTimeout(() => {
                video.pause();
                overlay.style.display = 'none';
            }, 1000);
        }

        video.onended = function() {
            finalizarIntro();
        };

        setTimeout(() => {
            if (!video.ended && video.paused) {
                console.log("Forzando entrada.");
                finalizarIntro();
            }
        }, 6000); 

        overlay.addEventListener('click', finalizarIntro);
    </script>

</body>
</html>
