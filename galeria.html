<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Promoción 2025</title>
    <style>
        /* --- ESTILOS GENERALES --- */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111; /* Fondo oscuro elegante */
            color: #fff;
        }

        /* Cabecera */
        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, #000, #111);
        }
        
        h1 {
            font-weight: 300;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            font-size: 24px;
        }

        .volver-btn {
            display: inline-block;
            margin-top: 10px;
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
        }
        
        .volver-btn:hover {
            color: #fff;
            border-bottom: 1px solid #fff;
        }

        /* --- GRILLA TIPO PINTEREST (MASONRY) --- */
        .gallery-container {
            column-count: 3; /* 3 columnas en PC */
            column-gap: 15px;
            padding: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Tablet (2 columnas) */
        @media (max-width: 800px) {
            .gallery-container {
                column-count: 2; 
            }
        }

        /* Celular (1 columna) */
        @media (max-width: 500px) {
            .gallery-container {
                column-count: 1; 
            }
        }

        /* Estilo de cada foto individual */
        .photo-item {
            margin-bottom: 15px;
            break-inside: avoid;
            opacity: 0; /* Animación de entrada */
            animation: aparecer 0.6s ease-out forwards;
        }

        .photo-item img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            background-color: #222;
        }

        .photo-item img:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        @keyframes aparecer {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- PIE DE PÁGINA --- */
        .footer-action {
            text-align: center;
            padding: 60px 20px;
            background-color: #0a0a0a;
        }

        .btn-descarga {
            padding: 15px 30px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
