<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Promoción 2025</title>
    <style>
        /* --- ESTILOS BÁSICOS (Sin animaciones complejas) --- */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #111111; /* Fondo Negro */
            color: #ffffff; /* Texto Blanco */
        }

        header {
            text-align: center;
            padding: 30px 20px;
            background-color: #000;
            border-bottom: 2px solid #333;
        }

        h1 { margin: 0; text-transform: uppercase; letter-spacing: 2px; }

        .volver-btn {
            display: inline-block;
            margin-top: 10px;
            color: #ccc;
            text-decoration: none;
            border: 1px solid #555;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* --- GRILLA DE FOTOS --- */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
            justify-content: center;
        }

        .photo-item {
            width: 48%; /* 2 fotos por fila en celular */
            margin: 1%;
            background-color: #222;
            border-radius: 5px;
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .photo-item { width: 31%; } /* 3 fotos en PC */
        }

        .photo-item img {
            width: 100%;
            height: auto;
            display: block;
            min-height: 100px; /* Para ver si carga algo */
        }

        /* --- BOTÓN FINAL --- */
        .footer-action {
            text-align: center;
            padding: 50px 20px;
            background-color: #000;
        }

        .btn-descarga {
            background-color: white;
            color: black;
            padding: 15px 25px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <header>
        <h1>Galería de Fotos</h1>
        <a href="index.html" class="volver-btn">← Volver al Inicio</a>
    </header>

    <div class="gallery-container" id="galeria">
        <p style="width:100%; text-align:center; color: #555;">Cargando imágenes...</p>
    </div>

    <div class="footer-action">
        <p>¿Quieres descargar los originales?</p>
        <a href="https://drive.google.com/" class="btn-descarga">Ver Álbum Completo</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // --- CONFIGURACIÓN ---
            const totalFotos = 113; 
            const carpeta = "fotos/";
            
            // INTENTA ESTO PRIMERO:
            const nombreInicio = "f (";
            const nombreFin = ").jpg"; // <--- ¿Es .jpg o .JPG?
            
            const contenedor = document.getElementById('galeria');
            contenedor.innerHTML = ""; // Limpiar mensaje de carga

            for (let i = 1; i <= totalFotos; i++) {
                const div = document.createElement('div');
                div.className = 'photo-item';

                const img = document.createElement('img');
                // Construye ruta: fotos/f (1).jpg
                img.src = carpeta + nombreInicio + i + nombreFin;
                img.alt = "Foto " + i;
                img.loading = "lazy";
                
                // Si la imagen falla, mostramos un borde rojo en vez de ocultarla
                // Así sabrás si el archivo existe o no.
                img.onerror = function() {
                    this.style.border = "2px solid red"; 
                    this.alt = "Error: No encontrada";
                };

                div.appendChild(img);
                contenedor.appendChild(div);
            }
        });
    </script>

</body>
</html>
